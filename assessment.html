<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <link href="assessment.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歯磨き粉専門店 - あなたにぴったりの歯磨き粉を見つけよう</title>
</head>

<body class="bg-primary-subtle">
  <hearder>
    <nav class="navbar bg-primary" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">歯磨き粉専門店</a>
      </div>
    </nav>
  </hearder>

  <div class="container pt-5">
    <h1>あなたにぴったりの歯磨き粉を見つけよう</h1>
    <P>お悩みやご希望を入力してください</P>

    <div class="row">
      <div class="col-sm-9 col-lg-6">
        <div class="input-group mb-3"> 
          <input type="text" class="form-control" id="user-name" size="40" maxlength="20" placeholder="例: ホワイトニング、歯周病、口臭など" />
          <button class="btn btn-primary" id="assessment">商品を探す</button>
        </div>
      </div>
    </div>

  <div class="row">
     <div class="col-lg-9">
       <div id="result-area"></div>
    </div>
    <div id="tweet-area" class="mt-3" style="display: none;"> </div>
 </div>
  <script src="assessment.js"></script>
</body>

</html>
